version: '3.7'

services:
  judge0:
    image: judge0/judge0:1.13.0
    container_name: judge0
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      # Disable isolate for Windows/WSL compatibility
      - ISOLATE_ENABLED=false
      - USE_ADVANCED_ISOLATE=false
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      # Mount cgroups (read-only to avoid permission issues)
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      # Create writable temp directories
      - judge0-tmp:/tmp
      - judge0-box:/box
    tmpfs:
      # Use tmpfs for temporary files
      - /run:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=100m
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    sysctls:
      - kernel.unprivileged_userns_clone=1
    # Create /box directory on startup
    command: >
      bash -c "
        mkdir -p /box &&
        chmod 777 /box &&
        chown judge0:judge0 /box &&
        /api/docker-entrypoint.sh
      "

  workers:
    image: judge0/judge0:1.13.0
    command: >
      bash -c "
        mkdir -p /box &&
        chmod 777 /box &&
        chown judge0:judge0 /box &&
        ./scripts/workers
      "
    privileged: true
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      # Disable isolate for Windows/WSL compatibility
      - ISOLATE_ENABLED=false
      - USE_ADVANCED_ISOLATE=false
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - judge0-tmp:/tmp
      - judge0-box:/box
    tmpfs:
      - /run:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=100m
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    sysctls:
      - kernel.unprivileged_userns_clone=1

  db:
    image: postgres:13.0
    container_name: judge0-db
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:6.0
    container_name: judge0-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
  judge0-tmp:
  judge0-box: