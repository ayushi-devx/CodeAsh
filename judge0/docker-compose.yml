version: '3.7'

services:
  judge0:
    image: judge0/judge0:1.13.0
    container_name: judge0
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  workers:
    image: judge0/judge0:1.13.0
    command: ["./scripts/workers"]
    privileged: true
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:13.0
    container_name: judge0-db
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:6.0
    container_name: judge0-redis
    command: redis-server
    volumes:
      - redis-data:/data
    restart: always

volumes:
  postgres-data:
  redis-data:
